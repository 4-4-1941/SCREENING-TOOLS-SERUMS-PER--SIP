<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tamizajes Clínicos - SIP SYSTEM</title>
    <meta name="theme-color" content="#0a2e44">
    <meta http-equiv="refresh" content="0; url=toolkit.html">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh; min-height: 100dvh;
            display: flex; align-items: center; justify-content: center;
            background: #0a2e44; color: #ffffff; text-align: center;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            padding: 20px;
        }
        .sip { font-size: 1.7rem; font-weight: 800; letter-spacing: .06em; }
        .sip span { color: #9fc3d8; }
        .sip small {
            display: block; margin-top: 8px;
            font-size: .92rem; font-weight: 600; letter-spacing: .14em;
            color: #9fc3d8; text-transform: uppercase;
        }
        .loader {
            width: 36px; height: 36px; margin: 22px auto 0;
            border: 3px solid rgba(255,255,255,.25); border-top-color: #ffffff;
            border-radius: 50%; animation: girar .8s linear infinite;
        }
        @keyframes girar { to { transform: rotate(360deg); } }
        p { margin-top: 16px; font-size: .95rem; color: #cfe3ee; }
        a { color: #ffffff; font-weight: 700; }
    </style>
</head>
<body>
    <div>
        <div class="sip">SIP <span>SYSTEM</span><small>Tamizajes Clínicos</small></div>
        <div class="loader"></div>
        <p>Redirigiendo al Toolkit de tamizajes…</p>
        <p><a href="toolkit.html">Entrar ahora</a></p>
    </div>
    <script>location.replace('toolkit.html');</script>
</body>
</html>
