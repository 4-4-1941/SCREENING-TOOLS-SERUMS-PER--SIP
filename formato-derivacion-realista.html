<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formato Derivación MINSA - Interactivo</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Arial', sans-serif;
      background: #f5f5f5;
      padding: 20px;
      color: #333;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    .header {
      background: linear-gradient(135deg, #2ecc71 0%, #27ae60 100%);
      color: white;
      padding: 20px;
      border-radius: 8px 8px 0 0;
      text-align: center;
      margin-bottom: 0;
    }

    .header h1 {
      font-size: 24px;
      margin-bottom: 5px;
    }

    .header p {
      font-size: 12px;
      opacity: 0.9;
    }

    .documento {
      background: white;
      border: 2px solid #2ecc71;
      padding: 30px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    .seccion {
      margin-bottom: 25px;
      border-left: 4px solid #2ecc71;
      padding-left: 15px;
    }

    .seccion-titulo {
      font-size: 14px;
      font-weight: bold;
      color: #27ae60;
      text-transform: uppercase;
      margin-bottom: 15px;
      letter-spacing: 1px;
    }

    .fila {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 15px;
    }

    .fila.completa {
      grid-template-columns: 1fr;
    }

    .campo {
      display: flex;
      flex-direction: column;
    }

    .campo label {
      font-size: 12px;
      font-weight: bold;
      color: #555;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .campo input,
    .campo select,
    .campo textarea {
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 13px;
      font-family: Arial, sans-serif;
      transition: all 0.3s ease;
    }

    .campo input:focus,
    .campo select:focus,
    .campo textarea:focus {
      outline: none;
      border-color: #2ecc71;
      box-shadow: 0 0 5px rgba(46, 204, 113, 0.3);
    }

    .campo textarea {
      resize: vertical;
      min-height: 60px;
    }

    /* INDICADORES DE VALIDACIÓN */
    .campo.valido input,
    .campo.valido select,
    .campo.valido textarea {
      border-color: #27ae60;
      background-color: #f0fdf4;
    }

    .campo.error input,
    .campo.error select,
    .campo.error textarea {
      border-color: #e74c3c;
      background-color: #fef2f2;
    }

    .campo.advertencia input,
    .campo.advertencia select,
    .campo.advertencia textarea {
      border-color: #f39c12;
      background-color: #fffbf0;
    }

    .indicador {
      display: flex;
      align-items: center;
      margin-top: 5px;
      font-size: 12px;
      height: 18px;
    }

    .indicador.valido {
      color: #27ae60;
    }

    .indicador.error {
      color: #e74c3c;
    }

    .indicador.advertencia {
      color: #f39c12;
    }

    .indicador.neutro {
      color: #999;
    }

    .indicador::before {
      margin-right: 5px;
      font-weight: bold;
    }

    .indicador.valido::before {
      content: "✓";
    }

    .indicador.error::before {
      content: "✗";
    }

    .indicador.advertencia::before {
      content: "⚠";
    }

    .indicador.neutro::before {
      content: "○";
    }

    /* PANEL ASISTENTE */
    .asistente {
      background: #f0f7ff;
      border-left: 4px solid #3498db;
      padding: 15px;
      margin-bottom: 20px;
      border-radius: 4px;
      display: none;
    }

    .asistente.activo {
      display: block;
    }

    .asistente.error {
      background: #fef2f2;
      border-left-color: #e74c3c;
    }

    .asistente.advertencia {
      background: #fffbf0;
      border-left-color: #f39c12;
    }

    .asistente.exito {
      background: #f0fdf4;
      border-left-color: #27ae60;
    }

    .asistente-titulo {
      font-weight: bold;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .asistente.error .asistente-titulo {
      color: #e74c3c;
    }

    .asistente.advertencia .asistente-titulo {
      color: #f39c12;
    }

    .asistente.exito .asistente-titulo {
      color: #27ae60;
    }

    .asistente-icono {
      font-size: 18px;
    }

    .asistente-mensaje {
      font-size: 13px;
      line-height: 1.5;
      color: #555;
    }

    .asistente-explicacion {
      background: white;
      margin-top: 10px;
      padding: 10px;
      border-radius: 4px;
      font-size: 12px;
      line-height: 1.6;
    }

    .asistente-explicacion strong {
      color: #2ecc71;
    }

    /* BOTONES */
    .botones {
      display: flex;
      gap: 10px;
      margin-top: 30px;
    }

    .btn {
      padding: 12px 24px;
      border: none;
      border-radius: 4px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s ease;
      flex: 1;
    }

    .btn-validar {
      background: #2ecc71;
      color: white;
    }

    .btn-validar:hover {
      background: #27ae60;
    }

    .btn-validar:disabled {
      background: #bdc3c7;
      cursor: not-allowed;
    }

    .btn-limpiar {
      background: #95a5a6;
      color: white;
    }

    .btn-limpiar:hover {
      background: #7f8c8d;
    }

    .btn-pdf {
      background: #3498db;
      color: white;
    }

    .btn-pdf:hover {
      background: #2980b9;
    }

    /* RESUMEN VALIDACIÓN */
    .resumen-validacion {
      background: white;
      border: 2px solid #2ecc71;
      padding: 20px;
      border-radius: 4px;
      margin-top: 20px;
      display: none;
    }

    .resumen-validacion.activo {
      display: block;
    }

    .resumen-validacion h3 {
      margin-bottom: 15px;
      color: #27ae60;
    }

    .resumen-campo {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid #eee;
      font-size: 13px;
    }

    .resumen-campo:last-child {
      border-bottom: none;
    }

    .resumen-estado {
      font-weight: bold;
    }

    .resumen-estado.ok {
      color: #27ae60;
    }

    .resumen-estado.error {
      color: #e74c3c;
    }

    /* RESPONSIVE */
    @media (max-width: 768px) {
      .fila {
        grid-template-columns: 1fr;
      }

      .documento {
        padding: 20px;
      }

      .header h1 {
        font-size: 18px;
      }

      .botones {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>📋 INFORME DE DERIVACIÓN</h1>
      <p>Sistema MINSA 2025 - Protocolo C.5 | Validación automática en tiempo real</p>
    </div>

    <!-- ASISTENTE VIRTUAL -->
    <div class="asistente" id="asistente">
      <div class="asistente-titulo">
        <span class="asistente-icono">💡</span>
        <span id="asistente-titulo-texto">Asistencia</span>
      </div>
      <div class="asistente-mensaje" id="asistente-mensaje"></div>
      <div class="asistente-explicacion" id="asistente-explicacion"></div>
    </div>

    <!-- DOCUMENTO -->
    <div class="documento">
      <!-- SECCIÓN 1: ADMINISTRATIVO -->
      <div class="seccion">
        <div class="seccion-titulo">📅 Datos Administrativos</div>
        
        <div class="fila">
          <div class="campo">
            <label for="fechaDerivacion">Fecha de Derivación *</label>
            <input type="date" id="fechaDerivacion" onchange="validarCampo('fechaDerivacion')">
            <div class="indicador" id="ind-fechaDerivacion"></div>
          </div>

          <div class="campo">
            <label for="establecimientoDerivador">Establecimiento Derivador *</label>
            <input type="text" id="establecimientoDerivador" placeholder="Ej: Centro de Salud María Auxiliadora" onchange="validarCampo('establecimientoDerivador')">
            <div class="indicador" id="ind-establecimientoDerivador"></div>
          </div>
        </div>

        <div class="campo completa">
          <label for="numeroHistoria">Número Historia Clínica *</label>
          <input type="text" id="numeroHistoria" placeholder="Ej: HC-2024-0001234" onchange="validarCampo('numeroHistoria')">
          <div class="indicador" id="ind-numeroHistoria"></div>
        </div>
      </div>

      <!-- SECCIÓN 2: PACIENTE -->
      <div class="seccion">
        <div class="seccion-titulo">👤 Datos del Paciente</div>
        
        <div class="fila">
          <div class="campo">
            <label for="nombrePaciente">Nombre Completo *</label>
            <input type="text" id="nombrePaciente" placeholder="Ej: Juan Carlos Mendoza López" onchange="validarCampo('nombrePaciente')">
            <div class="indicador" id="ind-nombrePaciente"></div>
          </div>

          <div class="campo">
            <label for="dniPaciente">DNI *</label>
            <input type="text" id="dniPaciente" placeholder="Ej: 72345678" onchange="validarCampo('dniPaciente')">
            <div class="indicador" id="ind-dniPaciente"></div>
          </div>
        </div>

        <div class="fila">
          <div class="campo">
            <label for="edadPaciente">Edad (años) *</label>
            <input type="number" id="edadPaciente" placeholder="Ej: 35" onchange="validarCampo('edadPaciente')">
            <div class="indicador" id="ind-edadPaciente"></div>
          </div>

          <div class="campo">
            <label for="sexo">Sexo *</label>
            <select id="sexo" onchange="validarCampo('sexo')">
              <option value="">-- Seleccionar --</option>
              <option value="M">Masculino</option>
              <option value="F">Femenino</option>
              <option value="O">Otro</option>
            </select>
            <div class="indicador" id="ind-sexo"></div>
          </div>
        </div>
      </div>

      <!-- SECCIÓN 3: DIAGNÓSTICO -->
      <div class="seccion">
        <div class="seccion-titulo">🔍 Diagnóstico (CIE-10)</div>
        
        <div class="campo completa">
          <label for="diagnosticoPrimario">Diagnóstico Primario (Código CIE-10) *</label>
          <input type="text" id="diagnosticoPrimario" placeholder="Ej: F321" onchange="validarCampo('diagnosticoPrimario'); sugerirDiagnosticos()">
          <div class="indicador" id="ind-diagnosticoPrimario"></div>
          <div id="sugerencias" style="margin-top: 8px; font-size: 12px;"></div>
        </div>

        <div class="campo completa">
          <label for="descripcionDiagnostico">Descripción del Diagnóstico *</label>
          <textarea id="descripcionDiagnostico" placeholder="Ej: Depresión moderada con síntomas ansiosos" onchange="validarCampo('descripcionDiagnostico')"></textarea>
          <div class="indicador" id="ind-descripcionDiagnostico"></div>
        </div>
      </div>

      <!-- SECCIÓN 4: MOTIVO Y EVALUACIÓN -->
      <div class="seccion">
        <div class="seccion-titulo">📊 Motivo de Derivación y Evaluación</div>
        
        <div class="campo completa">
          <label for="motivoDerivacion">¿Por qué se deriva? *</label>
          <textarea id="motivoDerivacion" placeholder="Ej: Depresión moderada que requiere psicoterapia especializada. Sin respuesta a intervención en I nivel tras 4 semanas." onchange="validarCampo('motivoDerivacion')"></textarea>
          <div class="indicador" id="ind-motivoDerivacion"></div>
        </div>

        <div class="campo completa">
          <label for="resultadosEvaluacion">Resultados de Evaluación (PHQ-9, AUDIT, etc) *</label>
          <textarea id="resultadosEvaluacion" placeholder="Ej: PHQ-9 = 19 puntos (depresión moderada). Ideación suicida presente pero sin plan específico." onchange="validarCampo('resultadosEvaluacion')"></textarea>
          <div class="indicador" id="ind-resultadosEvaluacion"></div>
        </div>
      </div>

      <!-- SECCIÓN 5: DESTINO -->
      <div class="seccion">
        <div class="seccion-titulo">🎯 Destino de Derivación (Lab)</div>
        
        <div class="campo completa">
          <label for="destinoLab">¿A dónde derivar? *</label>
          <select id="destinoLab" onchange="validarCampo('destinoLab'); mostrarValidacionDestino()">
            <option value="">-- Seleccionar destino --</option>
            <option value="1">Lab 1: I Nivel no especializado (Puesto de Salud)</option>
            <option value="2">Lab 2: CSMC (Centro Salud Mental Comunitario)</option>
            <option value="3">Lab 3: Hogar Protegido (Comunidad Terapéutica)</option>
            <option value="4">Lab 4: Unidad Hospitalización Psiquiátrica</option>
            <option value="5">Lab 5: Otra Institución (ONG, privada)</option>
          </select>
          <div class="indicador" id="ind-destinoLab"></div>
        </div>

        <div class="campo completa">
          <label for="medicacionActual">Medicación Actual (si aplica)</label>
          <textarea id="medicacionActual" placeholder="Ej: Sertralina 50 mg/día desde hace 2 semanas. Tolera bien, sin efectos adversos." onchange="validarCampo('medicacionActual')"></textarea>
          <div class="indicador" id="ind-medicacionActual"></div>
        </div>
      </div>

      <!-- SECCIÓN 6: PROFESIONAL -->
      <div class="seccion">
        <div class="seccion-titulo">✍️ Profesional Responsable</div>
        
        <div class="fila">
          <div class="campo">
            <label for="nombreProfesional">Nombre y Profesión *</label>
            <input type="text" id="nombreProfesional" placeholder="Ej: Dra. María González - Médica" onchange="validarCampo('nombreProfesional')">
            <div class="indicador" id="ind-nombreProfesional"></div>
          </div>

          <div class="campo">
            <label for="dniProfesional">DNI Profesional *</label>
            <input type="text" id="dniProfesional" placeholder="Ej: 12345678" onchange="validarCampo('dniProfesional')">
            <div class="indicador" id="ind-dniProfesional"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- BOTONES -->
    <div class="botones">
      <button class="btn btn-validar" onclick="validarFormularioCompleto()">✓ Validar Todo</button>
      <button class="btn btn-pdf" onclick="generarPDF()" id="btnPDF" disabled>📥 Descargar PDF</button>
      <button class="btn btn-limpiar" onclick="limpiarFormulario()">🔄 Limpiar</button>
    </div>

    <!-- RESUMEN VALIDACIÓN -->
    <div class="resumen-validacion" id="resumenValidacion">
      <h3>📋 Resumen de Validación</h3>
      <div id="resumenContenido"></div>
    </div>
  </div>

  <!-- BIBLIOTECA BASE DE DATOS -->
  <script>
    // MATRIZ REUTILIZABLE - BASE DE DATOS MINSA
    const baseConocimiento = {
      diagnosticos: {
        "F32": { nombre: "Depresión", recomendaciones: ["Lab 2 (CSMC) para depresión leve-moderada", "Lab 4 si ideación suicida severa"] },
        "F321": { nombre: "Depresión moderada", recomendaciones: ["Lab 2 (CSMC) obligatorio", "Requiere psicoterapia + medicación"] },
        "F200": { nombre: "Esquizofrenia paranoide", recomendaciones: ["Lab 4 (Hospitalización) si primer brote", "Lab 2 (CSMC) para mantenimiento"] },
        "F140": { nombre: "Consumo de cocaína", recomendaciones: ["Lab 2 (CSMC) especializado", "Programa integral multidisciplinario"] },
        "Z60.1": { nombre: "Violencia de pareja", recomendaciones: ["Lab 2 (CSMC) obligatorio", "Seguimiento mínimo 12 meses"] },
        "F41.1": { nombre: "Trastorno ansiedad generalizada", recomendaciones: ["Lab 1-2 según severidad", "Psicoterapia + medicación"] }
      },
      
      validaciones: {
        "diagnóstico-destino": {
          "F321": [2, 1], // Depresión moderada → Lab 2 o Lab 1
          "F200": [4, 2], // Esquizofrenia → Lab 4 o Lab 2
          "F140": [2, 3], // Cocaína → Lab 2 o Lab 3
          "Z60.1": [2], // Violencia → Lab 2
          "F41.1": [1, 2] // Ansiedad → Lab 1 o Lab 2
        }
      },

      explicaciones: {
        "Lab 1": "I Nivel: Competente para TMG leve, control preventivo post-egreso, pacientes estables sin medicación",
        "Lab 2": "CSMC: Para TMG moderado-severo, violencia, adicciones, requiere terapia especializada",
        "Lab 3": "Hogar Protegido: Comunidad terapéutica para casos que fallan en CSMC, requieren contención",
        "Lab 4": "Hospitalización: Crisis aguda, psicosis, urgencia, peligro a sí mismo/terceros",
        "Lab 5": "Otra institución: Especialidades no disponibles en red MINSA"
      }
    };

    // CONFIGURACIÓN DE CAMPOS
    const camposObligatorios = [
      'fechaDerivacion', 'establecimientoDerivador', 'numeroHistoria',
      'nombrePaciente', 'dniPaciente', 'edadPaciente', 'sexo',
      'diagnosticoPrimario', 'descripcionDiagnostico',
      'motivoDerivacion', 'resultadosEvaluacion',
      'destinoLab',
      'nombreProfesional', 'dniProfesional'
    ];

    // FUNCIONES VALIDACIÓN
    function validarCampo(idCampo) {
      const campo = document.getElementById(idCampo);
      const indicador = document.getElementById('ind-' + idCampo);
      const valor = campo.value.trim();

      let resultado = { valido: false, mensaje: '', tipo: 'neutro' };

      // VALIDACIONES ESPECÍFICAS
      if (idCampo === 'fechaDerivacion') {
        if (!valor) {
          resultado.tipo = 'error';
          resultado.mensaje = 'Fecha requerida';
        } else {
          resultado.valido = true;
          resultado.tipo = 'valido';
          resultado.mensaje = 'Fecha válida';
        }
      } else if (idCampo === 'dniPaciente' || idCampo === 'dniProfesional') {
        if (!valor) {
          resultado.tipo = 'error';
          resultado.mensaje = 'DNI requerido';
        } else if (!/^\d{7,8}$/.test(valor)) {
          resultado.tipo = 'error';
          resultado.mensaje = 'DNI debe tener 7-8 dígitos';
        } else {
          resultado.valido = true;
          resultado.tipo = 'valido';
          resultado.mensaje = 'DNI válido';
        }
      } else if (idCampo === 'edadPaciente') {
        if (!valor) {
          resultado.tipo = 'error';
          resultado.mensaje = 'Edad requerida';
        } else if (valor < 0 || valor > 120) {
          resultado.tipo = 'error';
          resultado.mensaje = 'Edad inválida (0-120)';
        } else {
          resultado.valido = true;
          resultado.tipo = 'valido';
          resultado.mensaje = 'Edad válida';
        }
      } else if (idCampo === 'diagnosticoPrimario') {
        if (!valor) {
          resultado.tipo = 'error';
          resultado.mensaje = 'Código CIE-10 requerido';
        } else if (!/^[A-Z]\d{2}(\.\d)?$/.test(valor)) {
          resultado.tipo = 'advertencia';
          resultado.mensaje = 'Formato CIE-10: Letra + 2 dígitos (ej: F321)';
        } else {
          resultado.valido = true;
          resultado.tipo = 'valido';
          resultado.mensaje = 'Código CIE-10 válido';
        }
      } else if (idCampo === 'destinoLab') {
        if (!valor) {
          resultado.tipo = 'error';
          resultado.mensaje = 'Selecciona destino';
        } else {
          resultado.valido = true;
          resultado.tipo = 'valido';
          resultado.mensaje = 'Destino seleccionado';
        }
      } else {
        // Campos de texto generales
        if (camposObligatorios.includes(idCampo) && !valor) {
          resultado.tipo = 'error';
          resultado.mensaje = 'Campo requerido';
        } else if (valor) {
          if (valor.length < 5) {
            resultado.tipo = 'advertencia';
            resultado.mensaje = 'Información incompleta';
          } else {
            resultado.valido = true;
            resultado.tipo = 'valido';
            resultado.mensaje = 'OK';
          }
        }
      }

      // ACTUALIZAR UI
      campo.classList.remove('valido', 'error', 'advertencia');
      indicador.classList.remove('valido', 'error', 'advertencia', 'neutro');

      if (resultado.tipo !== 'neutro') {
        campo.classList.add(resultado.tipo);
        indicador.classList.add(resultado.tipo);
        indicador.textContent = resultado.mensaje;
      } else {
        indicador.classList.add('neutro');
      }

      return resultado;
    }

    function sugerirDiagnosticos() {
      const valor = document.getElementById('diagnosticoPrimario').value.toUpperCase();
      const sugerencias = document.getElementById('sugerencias');

      if (valor.length === 0) {
        sugerencias.innerHTML = '';
        return;
      }

      let opciones = [];
      for (let codigo in baseConocimiento.diagnosticos) {
        if (codigo.includes(valor)) {
          opciones.push(`<strong>${codigo}</strong>: ${baseConocimiento.diagnosticos[codigo].nombre}`);
        }
      }

      if (opciones.length > 0) {
        sugerencias.innerHTML = '<div style="background: #f0fdf4; padding: 8px; border-radius: 4px; border-left: 3px solid #27ae60;">' + opciones.join('<br>') + '</div>';
      } else {
        sugerencias.innerHTML = '';
      }
    }

    function mostrarValidacionDestino() {
      const diagnostico = document.getElementById('diagnosticoPrimario').value.toUpperCase();
      const destino = document.getElementById('destinoLab').value;

      if (!diagnostico || !destino) return;

      const asistente = document.getElementById('asistente');
      const titulo = document.getElementById('asistente-titulo-texto');
      const mensaje = document.getElementById('asistente-mensaje');
      const explicacion = document.getElementById('asistente-explicacion');

      let diagnosticoBase = diagnostico.substring(0, 3);
      let destinosValidos = baseConocimiento.validaciones["diagnóstico-destino"][diagnosticoBase];

      if (destinosValidos && destinosValidos.includes(parseInt(destino))) {
        asistente.classList.add('activo', 'exito');
        asistente.classList.remove('error', 'advertencia');
        titulo.textContent = '✓ Combinación válida';
        mensaje.textContent = `${diagnostico} + Lab ${destino} es compatible con protocolo MINSA`;
        explicacion.innerHTML = `<strong>Recomendación MINSA:</strong> ${baseConocimiento.explicaciones['Lab ' + destino]}`;
      } else if (destinosValidos) {
        asistente.classList.add('activo', 'advertencia');
        asistente.classList.remove('error', 'exito');
        titulo.textContent = '⚠ Verificar destino';
        mensaje.textContent = `Lab ${destino} puede no ser óptimo para ${diagnostico}`;
        explicacion.innerHTML = `<strong>Sugerencia:</strong> Consider Lab ${destinosValidos[0]} según protocolo MINSA para este diagnóstico.`;
      }
    }

    function validarFormularioCompleto() {
      const asistente = document.getElementById('asistente');
      const titulo = document.getElementById('asistente-titulo-texto');
      const mensaje = document.getElementById('asistente-mensaje');
      const explicacion = document.getElementById('asistente-explicacion');
      const resumen = document.getElementById('resumenValidacion');
      const resumenContenido = document.getElementById('resumenContenido');

      let errores = [];
      let advertencias = [];

      // VALIDAR CADA CAMPO
      camposObligatorios.forEach(campo => {
        const resultado = validarCampo(campo);
        if (!resultado.valido && resultado.tipo === 'error') {
          errores.push(campo);
        } else if (!resultado.valido && resultado.tipo === 'advertencia') {
          advertencias.push(campo);
        }
      });

      // MOSTRAR RESULTADO
      if (errores.length === 0) {
        asistente.classList.add('activo', 'exito');
        asistente.classList.remove('error', 'advertencia');
        titulo.textContent = '✓ Derivación válida';
        mensaje.textContent = 'Todos los campos están completos y correctos. Puedes descargar el PDF.';
        explicacion.innerHTML = '<strong>Protocolo MINSA:</strong> Documento listo para firmar y enviar al establecimiento destino.';
        
        // HABILITAR BOTÓN PDF
        document.getElementById('btnPDF').disabled = false;

        // MOSTRAR RESUMEN
        let html = '';
        camposObligatorios.forEach(campo => {
          const valor = document.getElementById(campo).value;
          const resultado = validarCampo(campo);
          html += `<div class="resumen-campo"><strong>${campo}:</strong> <span class="resumen-estado ${resultado.valido ? 'ok' : 'error'}">${resultado.valido ? '✓ OK' : '✗ Error'}</span></div>`;
        });
        resumenContenido.innerHTML = html;
        resumen.classList.add('activo');

      } else {
        asistente.classList.add('activo', 'error');
        asistente.classList.remove('exito', 'advertencia');
        titulo.textContent = '✗ Errores encontrados';
        mensaje.textContent = `${errores.length} campo(s) con error`;
        explicacion.innerHTML = `<strong>Por favor corrige:</strong><br>${errores.join(', ')}`;
        document.getElementById('btnPDF').disabled = true;
        resumen.classList.remove('activo');
      }
    }

    function generarPDF() {
      const nombrePaciente = document.getElementById('nombrePaciente').value;
      const dniPaciente = document.getElementById('dniPaciente').value;
      const contenido = document.querySelector('.documento').innerHTML;

      const ventana = window.open('', '', 'width=900,height=600');
      ventana.document.write(`
        <!DOCTYPE html>
        <html>
        <head>
          <title>Derivación ${dniPaciente}</title>
          <style>
            body { font-family: Arial; margin: 20px; }
            .documento { border: 1px solid #ccc; padding: 20px; }
            .seccion { margin-bottom: 20px; border-left: 4px solid #2ecc71; padding-left: 10px; }
            input, select, textarea { border: 1px solid #ccc; padding: 5px; font-size: 12px; }
          </style>
        </head>
        <body>
          ${contenido}
          <p style="margin-top: 40px; text-align: right;">
            ________________________<br>
            Firma y Sello<br>
            ${document.getElementById('nombreProfesional').value}
          </p>
        </body>
        </html>
      `);
      ventana.document.close();
      ventana.print();
    }

    function limpiarFormulario() {
      document.querySelectorAll('input, select, textarea').forEach(campo => {
        campo.value = '';
        campo.classList.remove('valido', 'error', 'advertencia');
      });
      document.querySelectorAll('.indicador').forEach(ind => {
        ind.classList.remove('valido', 'error', 'advertencia', 'neutro');
        ind.textContent = '';
      });
      document.getElementById('asistente').classList.remove('activo');
      document.getElementById('resumenValidacion').classList.remove('activo');
      document.getElementById('btnPDF').disabled = true;
    }
  </script>
</body>
</html>
